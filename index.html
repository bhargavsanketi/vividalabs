<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Page</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .bg-container {
            /* Path to your image */
            background-image: url('vividabackground.png');

            /* Center the background image */
            background-position: center;

            /* Do not repeat the image */
            background-repeat: no-repeat;

            /* Scale the image to cover the entire screen */
            background-size: cover;

            /* Fill the viewport height */
            height: 100vh;
            width: 100%;
        }

        /* Optional: Style for content over the background */
        .content {
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 20%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="content">
            <h1>Welcome to My Site</h1>
            <p>Your background is now fully responsive.</p>
        </div>
    </div>

</body>
</html>
