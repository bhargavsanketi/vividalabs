<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vivida Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Courier+Prime:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #1e4027;
      --orange:       #d95f2b;
      --orange-light: #e8845a;
      --cream:        #f5f0e8;
      --font-display: 'Playfair Display', serif;
      --font-mono:    'Courier Prime', monospace;
      --font-body:    'Lato', sans-serif;
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    /* ═══════════════════════════════════════════
       NAVBAR
    ═══════════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 52px; height: 68px;
      background: rgba(30, 64, 39, 0.75);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border-bottom: 1px solid rgba(245,240,232,0.10);
    }

    /* ── LOGO AREA ──
       Option A (image logo): uncomment the <img> tag in the HTML below and delete the text wordmark div.
       Option B (text fallback): keep the .logo-wordmark div as-is and update the text.
    */
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

    .nav-logo img {
      height: 40px;       /* adjust to taste */
      width: auto;
      object-fit: contain;
      display: block;
    }

   
    .logo-sub {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.5px;
      color: rgba(245,240,232,0.50); text-transform: uppercase; margin-top: 3px;
    }

    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
    .nav-links a {
      font-family: var(--font-mono); font-size: 13px; letter-spacing: 1.5px;
      text-transform: uppercase; color: rgba(245,240,232,0.72); text-decoration: none;
      padding: 8px 18px; border-radius: 4px; transition: color .2s, background .2s;
    }
    .nav-links a:hover { color: var(--cream); background: rgba(245,240,232,0.08); }

    .nav-cta {
      font-family: var(--font-mono); font-weight: 700; font-size: 12px;
      letter-spacing: 2px; text-transform: uppercase; color: var(--cream);
      background: var(--orange); border: none; padding: 10px 22px; border-radius: 4px;
      cursor: pointer; text-decoration: none; transition: background .2s, transform .15s;
    }
    .nav-cta:hover { background: var(--orange-light); transform: translateY(-1px); }

    /* ═══════════════════════════════════════════
       HERO — FULL VIEWPORT
    ═══════════════════════════════════════════ */
    .hero {
      position: relative; width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }

    /* ── BACKGROUND IMAGE ──
       Replace  url('vividabackground.png')  with the filename of your exported image.
       Keep it in the same folder as this HTML file.
       background-position: center  — change to  top / bottom / left / right  to reframe.
    */
    .hero-bg {
      position: absolute; inset: 0;
      background-image: url('vividabackground.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.5);
      animation: heroZoom 14s ease-out forwards;
    }

    /* Dark tint over background — increase the last value (0.30) to darken more */
    .hero-bg::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(10, 24, 14, 0);
    }

    @keyframes heroZoom {
      from { transform: scale(1.04); }
      to   { transform: scale(1.00); }
    }

    /* Gradient fade at the bottom so content below blends in */
    .hero-fade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
      background: linear-gradient(to bottom, transparent, #f5f0e8);
      pointer-events: none; z-index: 1;
    }

    /* ── HERO CONTENT ── */
    .hero-content {
      position: relative; z-index: 2;
      text-align: center; padding: 0 24px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.3s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Small label pill above the logo */
    .hero-pill {
      display: inline-block; font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 2.5px; text-transform: uppercase; color: var(--orange-light);
      border: 1px solid var(--orange-light); border-radius: 100px;
      padding: 5px 16px; margin-bottom: 28px; opacity: .9;
    }

    /* ── HERO LOGO IMAGE ──
       If you have a logo image to show in the hero (larger, centred):
       uncomment .hero-logo-img below and add  <img src="your-logo.png" class="hero-logo-img">  in the HTML.
       If you want the text wordmark instead, keep the .hero-brand divs.
    */
    .hero-logo-img {
      /*max-width: min(420px, 70vw);
      width: 100%; height: auto;
      margin-bottom: 28px; */
      <img src="vivida_logo.png" class="hero-logo-img">
      /* drop-shadow so it pops on any background */
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.35));
      
    }

    /* Text wordmark fallback (shown when no logo image is used) */
    .hero-brand {
      font-family: var(--font-body); font-weight: 700;
      font-size: clamp(56px, 10vw, 120px); letter-spacing: 10px;
      text-transform: uppercase; color: var(--cream); line-height: 1; margin-bottom: 4px;
    }
    .hero-brand span { color: var(--orange); }

    .hero-brand-sub {
      font-family: var(--font-mono); font-size: clamp(11px, 1.5vw, 15px);
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(245,240,232,0.60); margin-bottom: 32px;
    }

    .hero-tagline {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(17px, 2.5vw, 26px); color: rgba(245,240,232,.88);
      font-weight: 400; max-width: 540px; line-height: 1.6; margin-bottom: 40px;
    }

    /* Buttons */
    .hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    .btn-primary {
      font-family: var(--font-mono); font-weight: 700; font-size: 13px;
      letter-spacing: 2px; text-transform: uppercase; color: var(--cream);
      background: var(--orange); border: none; padding: 14px 32px; border-radius: 4px;
      cursor: pointer; text-decoration: none; transition: background .2s, transform .15s;
    }
    .btn-primary:hover { background: var(--orange-light); transform: translateY(-2px); }

    .btn-outline {
      font-family: var(--font-mono); font-size: 13px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--cream); background: transparent;
      border: 1px solid rgba(245,240,232,.45); padding: 14px 32px; border-radius: 4px;
      cursor: pointer; text-decoration: none; transition: border-color .2s, background .2s, transform .15s;
    }
    .btn-outline:hover { border-color: var(--cream); background: rgba(245,240,232,.08); transform: translateY(-2px); }

    /* Scroll indicator */
    .scroll-hint {
      position: absolute; bottom: 44px; left: 50%; z-index: 3;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(7px); }
    }
    .scroll-hint span {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 2.5px;
      text-transform: uppercase; color: rgba(245,240,232,.40);
    }
    .scroll-arrow {
      width: 16px; height: 16px;
      border-right: 1.5px solid rgba(245,240,232,.35);
      border-bottom: 1.5px solid rgba(245,240,232,.35);
      transform: rotate(45deg);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      .nav-links { display: none; }
      .hero-brand { letter-spacing: 4px; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════
       NAVBAR
  ═══════════════════════════════════════════ -->
  <nav>
    <a href="#" class="nav-logo">

      <!-- ┌─────────────────────────────────────────────────────┐
           │  LOGO — OPTION A: use your exported image           │

           │  2. Uncomment the line below & update the src       │
           │  3. Delete the .logo-wordmark div underneath        │
           └─────────────────────────────────────────────────────┘ -->
      <img src="vivida_logo.png" alt="Vivida Labs logo" /

    
      <div>
        <div class="logo-sub">Bengaluru's Longevity Kitchen</div>
      </div>

    </a>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <a href="https://wa.me/919960443435" target="_blank" class="nav-cta">Pre-order →</a>
  </nav>


  <!-- ═══════════════════════════════════════════
       HERO
       Background image is set via CSS above in .hero-bg
  ═══════════════════════════════════════════ -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-fade"></div>

    <div class="hero-content">


    </b>
      </b>
      </b>
      </b>
      </b>
      </b>
      </b>
      <div class="hero-actions">
        <a href="#" class="btn-primary">Our Products</a>
        <a href="#" class="btn-secondary">Our Philosophy</a>
      </div>
    </div>

    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>

</body>
</html>
